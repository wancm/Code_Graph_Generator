<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#1f2733;--muted:#5f6b7a;--hint:#8a96a6;--line:rgba(31,39,51,.12);--line2:rgba(31,39,51,.26);--accent:#465dff;--edge:#8b95a3;--amber:#BA7517;--blue:#2F7FD0;--red:#D93C3B;--green:#3B8F2E;--chip:#f1f3f7;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171c;--panel:#1d2027;--text:#e6e8ec;--muted:#a3abb8;--hint:#7d8696;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.24);--accent:#8d9bff;--edge:#7a8392;--amber:#EF9F27;--blue:#5aa2ea;--red:#F07878;--green:#7cc46a;--chip:#262a33;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15171c;--panel:#1d2027;--text:#e6e8ec;--muted:#a3abb8;--hint:#7d8696;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.24);--accent:#8d9bff;--edge:#7a8392;--amber:#EF9F27;--blue:#5aa2ea;--red:#F07878;--green:#7cc46a;--chip:#262a33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 4px}
h1{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:12px}
.grow{flex:1;min-width:0}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
input[type=search]{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;width:260px;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 16px}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 16px 8px;color:var(--muted);font-size:12px;align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.banner{margin:0 16px 8px;padding:8px 12px;border-radius:6px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--panel))}
main{display:flex;gap:12px;padding:0 16px 10px;height:calc(100vh - 168px);min-height:440px}
#canvas{flex:1;min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none}
#canvas svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none}
#canvas svg.drag{cursor:grabbing}
aside{width:350px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto}
@media (max-width:900px){main{flex-direction:column;height:auto}#canvas{flex:none;height:70vh;min-height:360px}aside{width:auto}}
.n{cursor:pointer}
.n text{font-size:12px;font-weight:500;pointer-events:none}
.n text.s2{font-size:11px;font-weight:400}
.n.dim{opacity:.18}
.n.match rect{stroke:var(--accent);stroke-width:2.5}
.n.sel rect{stroke-width:2.6}
.e{fill:none;stroke:var(--edge);opacity:.5;stroke-width:1}
.e.u{stroke-dasharray:2 3}
.e.i{stroke-dasharray:6 4}
.e.dim{opacity:.06}
.e.in{stroke:var(--amber);opacity:1}
.e.out{stroke:var(--blue);opacity:1}
#mk-d path{fill:var(--edge)}
#mk-in path{fill:var(--amber)}
#mk-out path{fill:var(--blue)}
h2{font-size:15px;font-weight:600;margin:0 0 4px;word-break:break-all}
h3{font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--muted)}
.mono{font-family:var(--mono)}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;margin:2px 4px 2px 0;border-radius:4px;border:1px solid var(--line);background:var(--chip);cursor:pointer;color:var(--muted)}
.chip.d{color:var(--text);border-color:var(--line2);font-weight:600}
.chip:hover{border-color:var(--accent)}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line2);margin:2px 4px 2px 0}
.badge.red{color:var(--red);border-color:var(--red)}
.badge.amber{color:var(--amber);border-color:var(--amber)}
.badge.green{color:var(--green);border-color:var(--green)}
.kv{color:var(--muted)}
.kv b{color:var(--text);font-weight:500}
.files{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all;margin-top:6px}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--muted)}
details li{margin:4px 0;color:var(--muted);font-size:12px}
a{color:var(--accent)}
footer{padding:0 16px 12px;color:var(--hint);font-size:11px}
.hint{color:var(--hint)}
.tip{text-decoration:underline dotted var(--hint);text-underline-offset:3px;cursor:help}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="grow"><h1><span class="tip" title="Code graph (dependency graph): A map of a code base: each type is a box, and each line is one type using another.">Code graph</span> · <span id="src"></span></h1><div class="sub" id="sub"></div></div>
  <button id="theme" type="button">Dark mode</button>
</header>
<div class="toolbar">
  <input type="search" id="q" list="names" placeholder="Search a type" aria-label="Search a type">
  <datalist id="names"></datalist>
  <label title="Aggregation level: Shows each type, or merges them into one box per namespace or per project.">Group by <select id="group"><option value="type">Types</option><option value="ns">Namespaces</option><option value="project">Projects</option></select></label>
  <label title="Neighbourhood radius (hops): With a type selected, shows only the types up to this many lines away from it.">Neighbourhood depth <select id="depth"><option value="0">All</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
  <label title="Include test projects: Shows the test projects' types, in grey."><input type="checkbox" id="tests" checked> Show tests</label>
  <span><button id="m-in" type="button" title="Impact analysis (reverse dependencies): Every type that uses the selected type, directly or through other types: what may break if you change it.">Who it affects</button>
  <button id="m-out" type="button" title="Dependency analysis (forward dependencies): Every type the selected type uses, directly or through other types.">What it uses</button></span>
  <button id="clr" type="button">Clear selection</button>
  <button id="fit" type="button">Fit to screen</button>
</div>
<div class="banner" id="banner" hidden></div>
<div class="legend" id="legend"></div>
<main>
  <div id="canvas">
    <svg id="svg" role="img" aria-label="Code graph">
      <defs>
        <marker id="mk-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z"/></marker>
        <marker id="mk-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z"/></marker>
        <marker id="mk-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z"/></marker>
      </defs>
      <g id="vp"><g id="E"></g><g id="N"></g></g>
    </svg>
    <div class="empty" id="empty" hidden>Nothing to show</div>
  </div>
  <aside id="info"></aside>
</main>
<footer id="foot"></footer>
<script>const DATA = /*GRAPH_DATA*/null;</script>
<script>
(function () {
'use strict';
const D = DATA;
if (!D) { document.body.textContent = 'This file holds no graph data.'; return; }

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nodes = D.nodes, P = D.projects;
const edges = D.edges.map(e => ({ a: e[0], b: e[1], k: e[2], w: e[3] }));
const RANK = { i: 0, c: 1, u: 2 };
const KIND = { c: 'Calls or creates', u: 'Uses type', i: 'Implements or inherits' };
const TIP = {
  c: 'Call or instantiation link: The type calls a method or property of the other type, or creates one.',
  u: 'Type reference link: The type names the other type: a parameter, field, variable, generic argument or constant.',
  i: 'Inheritance link: The type implements the other type (an interface) or inherits it (a class).',
  direct: 'Direct dependency: Linked to the selected type by one line.',
  indirect: 'Transitive dependency: Linked to the selected type only through other types.',
  unreferenced: 'Unreferenced type (possible dead code): No other type in the code base refers to it; it may still be used through reflection, attributes or a framework.',
  testsOnly: 'Test-only reference: Only test projects refer to this type.',
  entry: 'Entry point: Where the program starts (Main or top-level statements), or a type a framework finds by itself, such as a controller; never counted as unreferenced.',
  kind: 'Type kind: Whether the type is a class, interface, record, struct, enum or delegate.',
  link: 'Dependency (edge): One line in the code graph: a type calling, using or implementing another.'
};
const REF = { unreferenced: ['No incoming references', 'red'], testsOnly: ['Only tests use it', 'amber'], entry: ['Entry point', 'green'] };

// Light fill, stroke, text, then dark fill, stroke, text.
const RAMPS = [
  ['#EEEDFE', '#534AB7', '#3C3489', '#3C3489', '#AFA9EC', '#EEEDFE'],
  ['#E1F5EE', '#0F6E56', '#085041', '#085041', '#5DCAA5', '#E1F5EE'],
  ['#FAECE7', '#993C1D', '#712B13', '#712B13', '#F0997B', '#FAECE7'],
  ['#FBEAF0', '#993556', '#72243E', '#72243E', '#ED93B1', '#FBEAF0'],
  ['#E6F1FB', '#185FA5', '#0C447C', '#0C447C', '#85B7EB', '#E6F1FB'],
  ['#EAF3DE', '#3B6D11', '#27500A', '#27500A', '#97C459', '#EAF3DE'],
  ['#FAEEDA', '#854F0B', '#633806', '#633806', '#EF9F27', '#FAEEDA'],
  ['#FCEBEB', '#A32D2D', '#791F1F', '#791F1F', '#F09595', '#FCEBEB']
];
const GRAY = ['#F1EFE8', '#5F5E5A', '#444441', '#444441', '#B4B2A9', '#F1EFE8'];
let next = 0;
const ramp = P.map(p => p.t ? GRAY : RAMPS[next++ % RAMPS.length]);

const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { } }
};
const saved = store.get('code-graph-theme');
if (saved) document.documentElement.dataset.theme = saved;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const col = p => { const r = ramp[p] || GRAY; return isDark() ? { f: r[3], s: r[4], t: r[5] } : { f: r[0], s: r[1], t: r[2] }; };

const BIG = 250;
const S = { sel: null, mode: 'in', group: 'type', depth: 0, tests: true, q: '' };
let view = null, bounds = null, moved = false;
const T = { x: 0, y: 0, k: 1 };

const measure = document.createElement('canvas').getContext('2d');
const textW = (s, weight) => { measure.font = `${weight || 500} 12px system-ui, -apple-system, "Segoe UI", Inter, sans-serif`; return measure.measureText(s).width; };
const el = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const isTestType = i => P[nodes[i].p].t;
const noun = n => S.group === 'type' ? (n === 1 ? 'type' : 'types') : S.group === 'ns' ? (n === 1 ? 'namespace' : 'namespaces') : (n === 1 ? 'project' : 'projects');

function ago(date) {
  const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function buildView() {
  const keep = i => S.tests || !isTestType(i);
  let V = [], VE = [];
  const vOf = new Map();
  if (S.group === 'type') {
    nodes.forEach((n, i) => { if (keep(i)) { vOf.set(i, V.length); V.push({ key: 't' + i, label: n.n, types: [i], p: n.p, t: i }); } });
    edges.forEach((e, ix) => {
      const a = vOf.get(e.a), b = vOf.get(e.b);
      if (a !== undefined && b !== undefined && a !== b) VE.push({ a, b, k: e.k, n: 1, src: ix });
    });
  } else {
    const groups = new Map();
    nodes.forEach((n, i) => {
      if (!keep(i)) return;
      const key = S.group === 'ns' ? 'ns:' + n.s : 'p:' + n.p;
      let g = groups.get(key);
      if (g === undefined) { g = V.length; groups.set(key, g); V.push({ key, label: S.group === 'ns' ? n.s : P[n.p].n, types: [], pc: {} }); }
      V[g].types.push(i); V[g].pc[n.p] = (V[g].pc[n.p] || 0) + 1; vOf.set(i, g);
    });
    V.forEach(v => {
      v.p = +Object.entries(v.pc).sort((x, y) => y[1] - x[1])[0][0];
      v.sub = fmt(v.types.length) + (v.types.length === 1 ? ' type' : ' types');
      v.dead = v.types.filter(i => nodes[i].r === 'unreferenced').length;
    });
    const agg = new Map();
    edges.forEach(e => {
      const a = vOf.get(e.a), b = vOf.get(e.b);
      if (a === undefined || b === undefined || a === b) return;
      const key = a + ',' + b, x = agg.get(key);
      if (x) { x.n++; if (RANK[e.k] < RANK[x.k]) x.k = e.k; } else agg.set(key, { a, b, k: e.k, n: 1 });
    });
    VE = [...agg.values()];
  }
  if (S.sel && S.depth > 0) {
    const s = V.findIndex(v => v.key === S.sel);
    if (s >= 0) {
      const adj = V.map(() => []);
      VE.forEach(e => { adj[e.a].push(e.b); adj[e.b].push(e.a); });
      const dist = new Int32Array(V.length).fill(-1), q = [s];
      dist[s] = 0;
      for (let h = 0; h < q.length; h++) {
        const v = q[h];
        if (dist[v] >= S.depth) continue;
        for (const w of adj[v]) if (dist[w] < 0) { dist[w] = dist[v] + 1; q.push(w); }
      }
      const re = new Int32Array(V.length).fill(-1), kept = [];
      V.forEach((v, i) => { if (dist[i] >= 0) { re[i] = kept.length; kept.push(v); } });
      VE = VE.filter(e => re[e.a] >= 0 && re[e.b] >= 0).map(e => Object.assign({}, e, { a: re[e.a], b: re[e.b] }));
      V = kept;
    }
  }
  V.forEach(v => { v.w = Math.ceil(Math.max(textW(v.label), v.sub ? textW(v.sub, 400) : 0)) + 28; v.h = v.sub ? 44 : 30; });
  const inA = V.map(() => []), outA = V.map(() => []), index = new Map();
  VE.forEach(e => { outA[e.a].push(e.b); inA[e.b].push(e.a); });
  V.forEach((v, i) => index.set(v.key, i));
  return { V, VE, inA, outA, index };
}

// Layered layout: break cycles, longest-path layers, barycenter ordering, wrap wide rows.
function layout(V, VE) {
  const n = V.length;
  if (!n) { bounds = null; return; }
  const out = V.map(() => []), inn = V.map(() => []);
  VE.forEach((e, ix) => { out[e.a].push(ix); inn[e.b].push(ix); });
  const back = new Uint8Array(VE.length), st = new Uint8Array(n);
  for (let s = 0; s < n; s++) {
    if (st[s]) continue;
    st[s] = 1;
    const stack = [[s, 0]];
    while (stack.length) {
      const top = stack[stack.length - 1], v = top[0];
      if (top[1] < out[v].length) {
        const ix = out[v][top[1]++], w = VE[ix].b;
        if (st[w] === 1) back[ix] = 1; else if (!st[w]) { st[w] = 1; stack.push([w, 0]); }
      } else { st[v] = 2; stack.pop(); }
    }
  }
  const deg = new Int32Array(n), layer = new Int32Array(n), order = [];
  VE.forEach((e, ix) => { if (!back[ix]) deg[e.b]++; });
  for (let v = 0; v < n; v++) if (!deg[v]) order.push(v);
  for (let h = 0; h < order.length; h++) {
    const v = order[h];
    for (const ix of out[v]) {
      if (back[ix]) continue;
      const w = VE[ix].b;
      if (layer[v] + 1 > layer[w]) layer[w] = layer[v] + 1;
      if (--deg[w] === 0) order.push(w);
    }
  }
  for (let h = order.length - 1; h >= 0; h--) {
    const v = order[h];
    const ins = inn[v].filter(ix => !back[ix]), outs = out[v].filter(ix => !back[ix]);
    if (!ins.length && outs.length) layer[v] = Math.min(...outs.map(ix => layer[VE[ix].b])) - 1;
  }
  const linked = new Uint8Array(n);
  VE.forEach(e => { linked[e.a] = 1; linked[e.b] = 1; });
  let maxL = 0;
  for (let v = 0; v < n; v++) if (linked[v]) maxL = Math.max(maxL, layer[v]);
  const rows = Array.from({ length: maxL + 1 }, () => []), alone = [];
  for (let v = 0; v < n; v++) (linked[v] ? rows[layer[v]] : alone).push(v);
  const byName = (x, y) => (V[x].p - V[y].p) || V[x].label.localeCompare(V[y].label);
  rows.forEach(r => r.sort(byName));
  alone.sort(byName);
  const GAP = 18, x = new Float64Array(n);
  const place = r => {
    const w = r.reduce((s, v) => s + V[v].w, 0) + GAP * (r.length - 1);
    let cx = -w / 2;
    for (const v of r) { x[v] = cx + V[v].w / 2; cx += V[v].w + GAP; }
  };
  rows.forEach(place);
  const ups = V.map((_, v) => inn[v].map(ix => VE[ix].a)), downs = V.map((_, v) => out[v].map(ix => VE[ix].b));
  for (let it = 0; it < 8; it++) {
    const down = it % 2 === 0;
    for (const r of (down ? rows : [...rows].reverse())) {
      const bary = new Map();
      for (const v of r) {
        const ns = down ? ups[v] : downs[v];
        bary.set(v, ns.length ? ns.reduce((s, w) => s + x[w], 0) / ns.length : x[v]);
      }
      r.sort((p, q) => bary.get(p) - bary.get(q));
      place(r);
    }
  }
  const MAXW = Math.max(1400, Math.sqrt(n) * 240), lines = [];
  const wrap = r => {
    let cur = [], w = 0;
    for (const v of r) {
      if (cur.length && w + V[v].w > MAXW) { lines.push(cur); cur = []; w = 0; }
      cur.push(v); w += V[v].w + GAP;
    }
    if (cur.length) lines.push(cur);
  };
  rows.forEach(wrap);
  const aloneFrom = lines.length;
  wrap(alone);
  let y = 0, minX = Infinity, maxX = -Infinity;
  lines.forEach((line, li) => {
    if (li === aloneFrom && li > 0) y += 30;
    place(line);
    const h = Math.max(...line.map(v => V[v].h));
    for (const v of line) {
      V[v].x = x[v] - V[v].w / 2; V[v].y = y + (h - V[v].h) / 2;
      minX = Math.min(minX, V[v].x); maxX = Math.max(maxX, V[v].x + V[v].w);
    }
    y += h + 64;
  });
  bounds = { x: minX, y: -10, w: maxX - minX, h: y - 44 };
}

function render(relayout) {
  if (relayout || !view) { view = buildView(); layout(view.V, view.VE); }
  draw();
}

function draw() {
  const { V, VE } = view;
  const E = $('E'), N = $('N');
  E.textContent = ''; N.textContent = '';
  $('empty').hidden = V.length > 0;
  const cx = v => v.x + v.w / 2;
  const outP = V.map(() => []), inP = V.map(() => []);
  VE.forEach((e, ix) => { outP[e.a].push(ix); inP[e.b].push(ix); });
  const from = new Map(), to = new Map();
  const spread = (v, list, end, m) => {
    list.sort((p, q) => cx(V[VE[p][end]]) - cx(V[VE[q][end]]));
    const k = list.length, step = k > 1 ? Math.min(12, (V[v].w - 20) / (k - 1)) : 0;
    list.forEach((ix, i) => m.set(ix, cx(V[v]) + (i - (k - 1) / 2) * step));
  };
  V.forEach((v, i) => { spread(i, outP[i], 'b', from); spread(i, inP[i], 'a', to); });
  const edgeFrag = document.createDocumentFragment();
  VE.forEach((e, ix) => {
    const a = V[e.a], b = V[e.b], sx = from.get(ix), tx = to.get(ix);
    let d;
    if (b.y >= a.y + a.h) { const sy = a.y + a.h, ty = b.y - 2, my = (sy + ty) / 2; d = `M${sx} ${sy}C${sx} ${my} ${tx} ${my} ${tx} ${ty}`; }
    else if (b.y + b.h <= a.y) { const sy = a.y, ty = b.y + b.h + 2, my = (sy + ty) / 2; d = `M${sx} ${sy}C${sx} ${my} ${tx} ${my} ${tx} ${ty}`; }
    else { const sy = a.y, ty = b.y - 2; d = `M${sx} ${sy}C${sx} ${sy - 46} ${tx} ${ty - 46} ${tx} ${ty}`; }
    const p = el('path', { d, class: 'e ' + e.k, 'marker-end': 'url(#mk-d)' });
    if (e.n > 1) p.style.strokeWidth = Math.min(4, 1 + Math.log2(e.n));
    e.el = p;
    edgeFrag.appendChild(p);
  });
  E.appendChild(edgeFrag);
  const nodeFrag = document.createDocumentFragment();
  V.forEach(v => {
    const c = col(v.p);
    const g = el('g', { class: 'n', transform: `translate(${v.x},${v.y})` });
    const r = el('rect', { width: v.w, height: v.h, rx: 6, fill: c.f, stroke: c.s });
    const type = v.t !== undefined ? nodes[v.t] : null;
    if (type && type.k === 'interface') r.setAttribute('stroke-dasharray', '4 3');
    g.appendChild(r);
    const t1 = el('text', { x: v.w / 2, y: v.sub ? 16 : v.h / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: c.t });
    t1.textContent = v.label;
    g.appendChild(t1);
    if (v.sub) {
      const t2 = el('text', { x: v.w / 2, y: 31, class: 's2', 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: c.t });
      t2.textContent = v.sub;
      g.appendChild(t2);
    }
    const mark = type ? REF[type.r] : (v.dead ? REF.unreferenced : null);
    if (mark) g.appendChild(el('circle', { cx: v.w - 7, cy: 7, r: 3.5, style: `fill:var(--${mark[1]})` }));
    const title = el('title', {});
    title.textContent = type
      ? `${type.f}\n${type.k} · ${P[type.p].n}${mark ? '\n' + mark[0] : ''}`
      : `${v.label}\n${v.sub}${v.dead ? `\n${fmt(v.dead)} with no incoming references` : ''}`;
    g.appendChild(title);
    g.addEventListener('click', () => { if (!moved) select(v.key); });
    v.el = g; v.rect = r;
    nodeFrag.appendChild(g);
  });
  N.appendChild(nodeFrag);
  paint();
}

function closure(s, dir) {
  const adj = dir === 'in' ? view.inA : view.outA;
  const seen = new Set([s]), q = [s];
  for (let h = 0; h < q.length; h++) for (const w of adj[q[h]]) if (!seen.has(w)) { seen.add(w); q.push(w); }
  return seen;
}

function matches(v, q) {
  return v.types.some(i => nodes[i].n.toLowerCase().includes(q) || (v.types.length === 1 && nodes[i].f.toLowerCase().includes(q)));
}

function paint() {
  const { V, VE, index } = view;
  ['m-in', 'm-out'].forEach(id => $(id).classList.toggle('on', id === 'm-' + S.mode));
  const s = S.sel !== null && index.has(S.sel) ? index.get(S.sel) : -1;
  const C = s >= 0 ? closure(s, S.mode) : null;
  V.forEach((v, i) => {
    v.el.classList.toggle('dim', !!C && !C.has(i));
    v.el.classList.toggle('sel', i === s);
    v.el.classList.toggle('match', !!S.q && matches(v, S.q));
  });
  VE.forEach(e => {
    const on = C && (S.mode === 'in' ? C.has(e.b) : C.has(e.a));
    e.el.setAttribute('class', 'e ' + e.k + (C ? (on ? ' ' + S.mode : ' dim') : ''));
    e.el.setAttribute('marker-end', on ? `url(#mk-${S.mode})` : 'url(#mk-d)');
  });
  info(s, C);
}

function select(key) {
  S.sel = key;
  if (S.depth > 0) { render(true); fit(); } else paint();
}

function focusType(i) {
  let relayout = false;
  if (!S.tests && isTestType(i)) { S.tests = true; $('tests').checked = true; relayout = true; }
  if (S.group !== 'type') {
    S.group = 'type'; $('group').value = 'type'; relayout = true;
    if (nodes.length > BIG && S.depth === 0) { S.depth = 2; $('depth').value = '2'; }
  }
  S.sel = 't' + i;
  if (relayout || S.depth > 0) { render(true); fit(); } else { paint(); center(S.sel); }
}

function where(e) {
  const w = e && e.src !== undefined ? edges[e.src].w : null;
  return w && w.length ? w.map(([f, l]) => f + (l ? ':' + l : '')).join('\n') : '';
}

function chip(i, direct, s) {
  const v = view.V[i];
  let title = '';
  if (direct && s !== undefined) {
    const e = view.VE.find(x => S.mode === 'in' ? (x.a === i && x.b === s) : (x.a === s && x.b === i));
    if (e) title = KIND[e.k] + (e.n > 1 ? ` (${fmt(e.n)} links)` : '') + (where(e) ? '\n' + where(e) : '');
  }
  return `<span class="chip${direct ? ' d' : ''}" data-key="${esc(v.key)}" title="${esc(title)}">${esc(v.label)}</span>`;
}

function refBadge(r) {
  const m = REF[r];
  return m ? `<span class="badge ${m[1]}" title="${esc(TIP[r])}">${m[0]}</span>` : r === 'test' ? '<span class="badge">Test code</span>' : '';
}

function info(s, C) {
  const box = $('info');
  if (s < 0) { box.innerHTML = summary(); bind(box); return; }
  const v = view.V[s];
  const direct = new Set(S.mode === 'in' ? view.inA[s] : view.outA[s]);
  direct.delete(s);
  const indirect = [...C].filter(i => i !== s && !direct.has(i));
  const total = C.size - 1, other = closure(s, S.mode === 'in' ? 'out' : 'in').size - 1;
  let h = '';
  if (v.t !== undefined) {
    const n = nodes[v.t];
    h += `<h2 class="mono">${esc(n.n)}</h2><div><span class="badge" title="${esc(TIP.kind)}">${esc(n.k)}</span>${refBadge(n.r)}</div>`;
    h += `<div class="kv">Project <b>${esc(P[n.p].n)}</b></div><div class="kv">Namespace <b>${esc(n.s)}</b></div>`;
    h += `<div class="files">${n.l.map(([f, l]) => esc(f) + (l ? ':' + l : '')).join('<br>')}</div>`;
  } else {
    h += `<h2>${esc(v.label)}</h2><div class="kv">${S.group === 'ns' ? 'Namespace' : 'Project'} · ${esc(v.sub)}</div>`;
  }
  h += `<h3>${S.mode === 'in' ? 'Who it affects' : 'What it uses'}</h3>`;
  if (!total) {
    h += `<div class="hint">${S.mode === 'in' ? `Nothing else here uses it.` : `It uses nothing else here.`}</div>`;
  } else {
    h += `<div><b>${fmt(total)}</b> ${noun(total)} (<span class="tip" title="${esc(TIP.direct)}">direct</span> ${fmt(direct.size)}, <span class="tip" title="${esc(TIP.indirect)}">indirect</span> ${fmt(indirect.length)})</div>`;
    h += '<div>' + [...direct].sort((x, y) => view.V[x].label.localeCompare(view.V[y].label)).map(i => chip(i, true, s)).join('')
      + indirect.sort((x, y) => view.V[x].label.localeCompare(view.V[y].label)).map(i => chip(i, false)).join('') + '</div>';
  }
  h += `<div class="hint" style="margin-top:8px">${S.mode === 'in' ? 'What it uses' : 'Who it affects'}: ${fmt(other)} ${noun(other)}. <a href="#" data-mode="${S.mode === 'in' ? 'out' : 'in'}">Show</a></div>`;
  if (v.t === undefined) {
    h += `<h3>Types in it (${fmt(v.types.length)})</h3><div>` + v.types.map(i => `<span class="chip" data-type="${i}" title="${esc(nodes[i].f)}">${esc(nodes[i].n)}</span>`).join('') + '</div>';
  }
  if (S.depth > 0) h += `<p class="hint">Showing types up to ${S.depth} ${S.depth === 1 ? 'line' : 'lines'} away. Set Neighbourhood depth to All to see everything.</p>`;
  box.innerHTML = h;
  bind(box);
}

function summary() {
  const lists = { unreferenced: [], testsOnly: [], entry: [] };
  nodes.forEach((n, i) => { if (lists[n.r]) lists[n.r].push(i); });
  let h = `<h2>${esc(D.source)}</h2><div class="kv">${fmt(nodes.length)} types · <span class="tip" title="${esc(TIP.link)}">${fmt(edges.length)} links</span> · ${fmt(P.length)} projects</div>`;
  h += `<div class="files">${esc(D.root)}</div>`;
  h += '<p class="hint">Click a type to see who it affects. Drag to move, scroll to zoom, Esc clears the selection.</p>';
  for (const r of ['unreferenced', 'testsOnly', 'entry']) {
    const list = lists[r];
    h += `<h3><span class="dot" style="background:var(--${REF[r][1]})"></span><span class="tip" title="${esc(TIP[r])}">${REF[r][0]}</span> (${fmt(list.length)})</h3>`;
    h += list.length
      ? '<div>' + list.sort((x, y) => nodes[x].n.localeCompare(nodes[y].n)).map(i => `<span class="chip" data-type="${i}" title="${esc(nodes[i].f)}">${esc(nodes[i].n)}</span>`).join('') + '</div>'
      : '<div class="hint">None</div>';
  }
  if (D.warnings && D.warnings.length) {
    h += `<details><summary>Warnings (${fmt(D.warnings.length)})</summary><ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>`;
  }
  return h;
}

function bind(box) {
  box.querySelectorAll('[data-key]').forEach(c => c.addEventListener('click', () => { select(c.dataset.key); center(c.dataset.key); }));
  box.querySelectorAll('[data-type]').forEach(c => c.addEventListener('click', () => focusType(+c.dataset.type)));
  box.querySelectorAll('[data-mode]').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); S.mode = a.dataset.mode; paint(); }));
}

function apply() { $('vp').setAttribute('transform', `translate(${T.x},${T.y}) scale(${T.k})`); }

// Refit when the canvas changes size, until the reader pans or zooms by hand.
let handMoved = false;

function fit() {
  handMoved = false;
  const svg = $('svg'), W = svg.clientWidth, H = svg.clientHeight;
  if (!bounds || !W || !H) return;
  const pad = 30;
  T.k = Math.max(0.03, Math.min((W - 2 * pad) / Math.max(bounds.w, 1), (H - 2 * pad) / Math.max(bounds.h, 1), 1.4));
  T.x = (W - bounds.w * T.k) / 2 - bounds.x * T.k;
  T.y = Math.max(pad, (H - bounds.h * T.k) / 2) - bounds.y * T.k;
  apply();
}

function center(key) {
  const i = view.index.get(key);
  if (i === undefined) return;
  const v = view.V[i], svg = $('svg');
  if (T.k < 0.7) T.k = 1;
  T.x = svg.clientWidth / 2 - (v.x + v.w / 2) * T.k;
  T.y = svg.clientHeight / 2 - (v.y + v.h / 2) * T.k;
  apply();
}

function legend() {
  const counts = P.map(() => 0);
  nodes.forEach(n => counts[n.p]++);
  let h = P.map((p, i) => { const c = col(i); return `<span title="${esc(p.f)}"><span class="sw" style="background:${c.f};border-color:${c.s}"></span>${esc(p.n)} (${fmt(counts[i])})${p.t ? ' · test' : ''}</span>`; }).join('');
  const line = k => `<svg width="24" height="8" style="vertical-align:middle"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--edge)" stroke-width="1.4"${k === 'u' ? ' stroke-dasharray="2 3"' : k === 'i' ? ' stroke-dasharray="6 4"' : ''}/></svg>`;
  h += ['c', 'u', 'i'].map(k => `<span class="tip" title="${esc(TIP[k])}">${line(k)} ${KIND[k]}</span>`).join('');
  h += '<span>Dashed border = interface</span>';
  h += ['unreferenced', 'testsOnly', 'entry'].map(r => `<span class="tip" title="${esc(TIP[r])}"><span class="dot" style="background:var(--${REF[r][1]})"></span>${REF[r][0]}</span>`).join('');
  $('legend').innerHTML = h;
}

function header() {
  const at = new Date(D.generatedAt);
  const exact = at.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'medium' }) + ' (' + Intl.DateTimeFormat().resolvedOptions().timeZone + ')';
  $('src').textContent = D.source;
  $('sub').innerHTML = `${fmt(nodes.length)} types · ${fmt(edges.length)} links · ${fmt(P.length)} projects · <span title="${esc(exact)}">Generated ${ago(at)}</span>`;
  $('foot').textContent = `Made by Code Graph Generator ${D.tool} with Roslyn · ${D.root}`;
  $('theme').textContent = isDark() ? 'Light mode' : 'Dark mode';
}

function findType(text) {
  const t = text.trim();
  if (!t) return -1;
  const parts = t.split(' · ');
  if (parts.length === 2) { const i = nodes.findIndex(n => n.n === parts[0] && n.s === parts[1]); if (i >= 0) return i; }
  const lower = t.toLowerCase();
  let i = nodes.findIndex(n => n.n.toLowerCase() === lower);
  if (i < 0) i = nodes.findIndex(n => n.n.toLowerCase().includes(lower));
  return i;
}

$('names').innerHTML = nodes.map(n => `<option value="${esc(n.n + ' · ' + n.s)}"></option>`).join('');
$('q').addEventListener('input', e => {
  const text = e.target.value;
  if (text.includes(' · ')) { const i = findType(text); if (i >= 0) { S.q = ''; focusType(i); return; } }
  S.q = text.trim().toLowerCase();
  paint();
});
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const i = findType(e.target.value); if (i >= 0) { S.q = ''; focusType(i); } } });
$('group').addEventListener('change', e => {
  const g = e.target.value;
  if (S.sel && S.sel[0] === 't' && g !== 'type') { const n = nodes[+S.sel.slice(1)]; S.sel = g === 'ns' ? 'ns:' + n.s : 'p:' + n.p; }
  else if (!(S.sel && S.sel[0] === 't')) S.sel = null;
  S.group = g;
  render(true); fit();
});
$('depth').addEventListener('change', e => { S.depth = +e.target.value; render(true); fit(); });
$('tests').addEventListener('change', e => {
  S.tests = e.target.checked;
  if (!S.tests && S.sel && S.sel[0] === 't' && isTestType(+S.sel.slice(1))) S.sel = null;
  render(true); fit();
});
$('m-in').addEventListener('click', () => { S.mode = 'in'; paint(); });
$('m-out').addEventListener('click', () => { S.mode = 'out'; paint(); });
$('clr').addEventListener('click', () => clear());
$('fit').addEventListener('click', () => fit());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== $('q')) clear(); });
function clear() { S.sel = null; if (S.depth > 0) { render(true); fit(); } else paint(); }

$('theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  store.set('code-graph-theme', t);
  header(); legend(); draw();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { header(); legend(); draw(); });

const svg = $('svg');
let drag = null;
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(4, Math.max(0.03, T.k * Math.exp(-e.deltaY * 0.0015)));
  T.x = mx - (mx - T.x) * (k / T.k); T.y = my - (my - T.y) * (k / T.k); T.k = k;
  handMoved = true;
  apply();
}, { passive: false });
if (window.ResizeObserver) new ResizeObserver(() => { if (!handMoved) fit(); }).observe(svg);
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, tx: T.x, ty: T.y, id: e.pointerId }; moved = false; });
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 4) { moved = true; handMoved = true; svg.classList.add('drag'); svg.setPointerCapture(drag.id); }
  if (moved) { T.x = drag.tx + dx; T.y = drag.ty + dy; apply(); }
});
const stop = () => { drag = null; svg.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); };
svg.addEventListener('pointerup', stop);
svg.addEventListener('pointercancel', stop);

if (nodes.length > BIG) {
  S.group = P.length > 1 ? 'project' : 'ns';
  $('group').value = S.group;
  const banner = $('banner');
  banner.hidden = false;
  banner.textContent = `Large code base (${fmt(nodes.length)} types), so it opens grouped by ${S.group === 'project' ? 'project' : 'namespace'}. `
    + 'Search for a type to see its neighbourhood, or set Group by to Types.';
}
header();
legend();
render(true);
fit();
})();
</script>
</body>
</html>
